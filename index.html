<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <title>Gjarpri - Snake Game</title>
  <style>
    body {
      margin: 0;
      background: #0f0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
    }

    h1 {
      color: #e94560;
      margin-bottom: 5px;
    }

    .score {
      font-size: 22px;
      margin-bottom: 15px;
    }

    canvas {
      background: #1a1a2e;
      border: 3px solid #e94560;
      border-radius: 8px;
    }

    .controls {
      margin-top: 15px;
      color: #aaa;
      font-size: 14px;
    }

    button {
      margin-top: 15px;
      padding: 10px 25px;
      font-size: 16px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #ff6b81;
    }
  </style>
</head>
<body>

  <h1>Gjarpri</h1>
  <div class="score">Pikët: <span id="score">0</span></div>
  <canvas id="game" width="400" height="400"></canvas>
  <div class="controls">Përdor shigjetat ← ↑ → ↓ për të lëvizur</div>
  <button onclick="restartGame()">Rifillo</button>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");

    const gridSize = 20;
    const tileCount = 20;

    let snake = [{x: 10, y: 10}];
    let food = {x: 15, y: 15};
    let dx = 0;
    let dy = 0;
    let score = 0;
    let gameRunning = true;

    document.addEventListener("keydown", changeDirection);

    function changeDirection(e) {
      if (e.key === "ArrowUp" && dy !== 1) {
        dx = 0; dy = -1;
      } else if (e.key === "ArrowDown" && dy !== -1) {
        dx = 0; dy = 1;
      } else if (e.key === "ArrowLeft" && dx !== 1) {
        dx = -1; dy = 0;
      } else if (e.key === "ArrowRight" && dx !== -1) {
        dx = 1; dy = 0;
      }
    }

    function drawGame() {
      if (!gameRunning) return;

      // Lëviz gjarprin
      const head = {x: snake[0].x + dx, y: snake[0].y + dy};

      // Goditje me mur
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver();
        return;
      }

      // Goditje me veten
      for (let part of snake) {
        if (part.x === head.x && part.y === head.y) {
          gameOver();
          return;
        }
      }

      snake.unshift(head);

      // Ha ushqimin
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreElement.textContent = score;
        placeFood();
      } else {
        snake.pop();
      }

      // Vizato
      ctx.fillStyle = "#1a1a2e";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Ushqimi
      ctx.fillStyle = "#e94560";
      ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

      // Gjarpri
      ctx.fillStyle = "#0f3460";
      for (let part of snake) {
        ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
      }

      // Koka e gjarprit
      ctx.fillStyle = "#e94560";
      ctx.fillRect(snake[0].x * gridSize, snake[0].y * gridSize, gridSize - 2, gridSize - 2);
    }

    function placeFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);

      // Mos e vendos mbi gjarprin
      for (let part of snake) {
        if (part.x === food.x && part.y === food.y) {
          placeFood();
          return;
        }
      }
    }

    function gameOver() {
      gameRunning = false;
      ctx.fillStyle = "rgba(0,0,0,0.7)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#e94560";
      ctx.font = "30px Arial";
      ctx.textAlign = "center";
      ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = "18px Arial";
      ctx.fillText("Pikët: " + score, canvas.width / 2, canvas.height / 2 + 25);
    }

    function restartGame() {
      snake = [{x: 10, y: 10}];
      food = {x: 15, y: 15};
      dx = 0;
      dy = 0;
      score = 0;
      scoreElement.textContent = "0";
      gameRunning = true;
    }

    // Nis lojën
    setInterval(drawGame, 120);
  </script>

</body>
</html>
